# north-compositor configuration file

[input:keyboard]
layout = us
repeat_rate = 25
repeat_delay = 600

[input:touchpad]
tap = true
natural_scroll = true

[input:pointer]
natural_scroll = false

[output:eDP-1]
mode = 1920x1080@60
scale = 1.0
position = 0,0
enabled = true

[decoration]
font = Sans 10
titlebar_height = 28
border_width = 1
shadow_radius = 18
force_ssd = false
active_title = #1e2230ff
inactive_title = #2a2e3aff
active_border = #3b4252ff
inactive_border = #2e3440ff

[workspaces]
count = 9

[bind]
Super+Return = exec foot
Super+Q = close
Super+Up = maximize
Super+F = fullscreen
Alt+Tab = focus_next
Super+Shift+R = reload
Super+Shift+E = exit
Super+1 = workspace 1
Super+2 = workspace 2
Super+3 = workspace 3
Super+4 = workspace 4
Super+5 = workspace 5
Super+6 = workspace 6
Super+7 = workspace 7
Super+8 = workspace 8
Super+9 = workspace 9
Super+Shift+1 = move_to_workspace 1
Super+Shift+2 = move_to_workspace 2
Super+Shift+3 = move_to_workspace 3
Super+Shift+4 = move_to_workspace 4
Super+Shift+5 = move_to_workspace 5
Super+Shift+6 = move_to_workspace 6
Super+Shift+7 = move_to_workspace 7
Super+Shift+8 = move_to_workspace 8
Super+Shift+9 = move_to_workspace 9
Super+Ctrl+Left = workspace_prev
Super+Ctrl+Right = workspace_next
