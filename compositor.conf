# north-compositor configuration file

[input:keyboard]
layout = us
repeat_rate = 25
repeat_delay = 600

[input:touchpad]
tap = true
natural_scroll = true

[input:pointer]
natural_scroll = false

[output:eDP-1]
mode = 1920x1080@60
scale = 1.0
position = 0,0
enabled = true

[decoration]
font = Sans 10
titlebar_height = 28
border_width = 1
shadow_radius = 18
force_ssd = false
active_title = #1e2230ff
inactive_title = #2a2e3aff
active_border = #3b4252ff
inactive_border = #2e3440ff

[bind]
Super+Return = exec foot
Super+Q = close
Super+Up = maximize
Super+F = fullscreen
Alt+Tab = focus_next
Super+Shift+R = reload
Super+Shift+E = exit
